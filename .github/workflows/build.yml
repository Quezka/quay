name: build

# Quay is written in Rust in the suite-rs repository (crates/quay). This repo holds its packaging and releases:
# CI builds the crate at the commit named in suite-rs.ref.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out suite-rs at the pinned commit
        run: |
          git clone --quiet https://github.com/Quezka/suite-rs.git suite-rs
          git -C suite-rs checkout --quiet "$(cat suite-rs.ref)"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: suite-rs
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Test
        run: cargo test --release -p quay --manifest-path suite-rs/Cargo.toml
      - name: Build
        run: cargo build --release -p quay --manifest-path suite-rs/Cargo.toml
      - name: Package
        run: |
          version=$(grep -m1 '^version' suite-rs/crates/quay/Cargo.toml | cut -d'"' -f2)
          scripts/build_deb.sh suite-rs/target/release/quay "$version" dist
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: Quay-Linux
          path: dist/*.deb

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out suite-rs at the pinned commit
        shell: bash
        run: |
          git clone --quiet https://github.com/Quezka/suite-rs.git suite-rs
          git -C suite-rs checkout --quiet "$(cat suite-rs.ref)"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: suite-rs
      - name: Build
        run: cargo build --release -p quay --manifest-path suite-rs/Cargo.toml
      - name: Install Inno Setup (if the runner lacks it)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Make the setup
        shell: bash
        run: |
          version=$(grep -m1 '^version' suite-rs/crates/quay/Cargo.toml | cut -d'"' -f2)
          mkdir -p app dist
          cp suite-rs/target/release/quay.exe app/Quay.exe
          app/Quay.exe --write-icon dist/quay.ico
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DAppVersion=$version" "/DPublisher=Quezka" "/DHomepage=https://github.com/Quezka/quay" \
            "/DSourceDir=$(cygpath -w "$PWD/app")" "/DIconFile=$(cygpath -w "$PWD/dist/quay.ico")" \
            "/DOutputDir=$(cygpath -w "$PWD/dist")" packaging/quay.iss
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: Quay-Windows
          path: dist/*-setup.exe

  release:
    # Pushing a tag like v1.2.3 publishes that version's .deb and setup .exe.
    needs: [package-linux, package-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the crate's version
        run: |
          git clone --quiet https://github.com/Quezka/suite-rs.git suite-rs
          git -C suite-rs checkout --quiet "$(cat suite-rs.ref)"
          version=$(grep -m1 '^version' suite-rs/crates/quay/Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match crates/quay version ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_notes.py "$VERSION" > notes.md
          cat >> notes.md <<'NOTES'

          ## Install

          **Debian / Ubuntu:** `sudo apt install ./quay_*_amd64.deb`. Quay appears in your app menu.

          **Windows:** download `Quay-…-windows-x64-setup.exe` and run it. It installs for your user (no admin
          needed). It isn't code-signed, so SmartScreen may warn you: choose *More info → Run anyway*.
          NOTES
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Quay $VERSION" \
            --notes-file notes.md artifacts/Quay-Linux/*.deb artifacts/Quay-Windows/*-setup.exe
